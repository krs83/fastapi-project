[project]
name = "fastapi-project"
version = "0.1.0"
description = "New fastAPI project"
readme = "README.md"
authors = [
    { name = "krs83", email = "krs83@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fastapi-project = "fastapi_project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
